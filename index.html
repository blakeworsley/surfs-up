<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Wave Rider - Surfer Game</title>
  <link rel="stylesheet" href="css/reset.css" charset="utf-8">
  <link rel="stylesheet" href="css/style.css" charset="utf-8">
  <link href="https://fonts.googleapis.com/css?family=Covered+By+Your+Grace" rel="stylesheet">
</head>
<body>
  <header>
    <h1>🏄 Wave Rider 🌊</h1>
  </header>
  <div class = "container">
    <canvas id="surfer-game" style="border: 5px solid #15607F; background: linear-gradient(to bottom, #87CEEB 0%, #4682B4 100%);" width="600" height="200" ></canvas>
  </div>

  <h2>Use Arrow Keys (↑↓) or W/S to ride the waves!</h2>
  <h2>Avoid other surfers and swimmers in the water.</h2>
  <h2>Press "spacebar" to start a new game.</h2>

  <script src="main.bundle.js"></script>
</body>
</html>
